<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AlgoProof">
  <!-- Favicon. Même marque que public/logo.svg, sur sa propre tuile : un onglet
       de navigateur n'est pas garanti sombre, et le halo du check ne fonctionne
       que contre le fond du site. Traits épaissis et art réduit à 0,86 : à 16 px
       la version du hero devient illisible.

       Jusqu'au 2026-09-20 ce dépôt servait encore le favicon.ico par défaut de
       Create Next App (posé par le commit 141efe9, jamais remplacé) : chaque
       onglet et chaque lien partagé montrait le logo Next.js. -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <g transform="translate(4.5 4.5) scale(0.86)">
    <line x1="12.5" y1="30" x2="12.5" y2="54" stroke="#f87171" stroke-width="3.5"/>
    <rect x="8" y="34" width="9" height="16" rx="2" fill="#f87171"/>

    <line x1="26.5" y1="24" x2="26.5" y2="48" stroke="#9aa0aa" stroke-width="3.5"/>
    <rect x="22" y="28" width="9" height="16" rx="2" fill="#9aa0aa"/>

    <line x1="40.5" y1="17" x2="40.5" y2="42" stroke="#4ade80" stroke-width="3.5"/>
    <rect x="36" y="21" width="9" height="17" rx="2" fill="#4ade80"/>

    <path d="M36 22 L45 32 L60 9" stroke="#0a0a0a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M36 22 L45 32 L60 9" stroke="#4ade80" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
